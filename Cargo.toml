[package]
name = "rowdiff"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Diff two CSV exports by key, including files larger than memory"

[dependencies]
csv = "1.3"
thiserror = "2"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
axum = { version = "0.8", features = ["multipart"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net", "signal", "io-util"], optional = true }
tower-http = { version = "0.6", features = ["fs"], optional = true }

[features]
web = ["dep:axum", "dep:tokio", "dep:tower-http"]

[[bin]]
name = "rowdiff"
path = "src/main.rs"

[[bin]]
name = "rowdiff-web"
path = "src/bin/web.rs"
required-features = ["web"]
